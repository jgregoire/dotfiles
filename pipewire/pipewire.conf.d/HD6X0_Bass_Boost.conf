# Bass boost for Sennheiser HD 6X0 headphones
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Sennheiser HD6X0 Bass Boost"
            media.name       = "Sennheiser HD6X0 Bass Boost"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq0
                        label = bq_highshelf
                        control = { "Freq" = 0.0 "Q" = 1.0 "Gain" = -12 }
                    }
                    {
                        type = builtin
                        name = eq1
                        label = bq_peaking
                        control = { "Freq" = 22 "Q" = 0.33 "Gain" = 12 }
                    }
                ]
                links = [
                    { output = "eq0:Out" input = "eq1:In" }
                ]
            }
	        audio.channels = 2
	        audio.position = [ FL FR ]
            capture.props = {
                node.name   = "HD6X0 EQ In"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "HD6X0 EQ Out"
                node.passive = true
            }
        }
    }
]
